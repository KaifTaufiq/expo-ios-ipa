name: Build Unsigned iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Fix Node PATH for Xcode
        run: |
          # Create a symlink so Xcode's internal scripts can find Node.js
          sudo ln -s $(which node) /usr/local/bin/node || true

      - name: Install dependencies
        run: npm install

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios

      - name: Build App (Unsigned)
        run: |
          cd ios
          
          # Find the workspace and scheme
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' | head -1 | xargs basename)
          if [ -z "$WORKSPACE" ]; then
            echo "No .xcworkspace file found!"
            exit 1
          fi
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          IPA_NAME="${SCHEME}.ipa"

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

          # Your exact local xcodebuild command, using dynamic variables
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            clean archive \
            -archivePath unsigned.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # Your exact local packaging steps
          cd unsigned.xcarchive/Products
          mv Applications Payload
          zip -r Payload.zip Payload
          
          # Move the zip back to the ios directory as the final IPA
          mv Payload.zip "../../$IPA_NAME"
          
          # Go back to the ios directory
          cd ../../
          
          echo "🎉 Successfully created $IPA_NAME"
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ios/*.ipa
