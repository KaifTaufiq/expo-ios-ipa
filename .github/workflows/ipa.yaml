name: Build Unsigned iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios

      - name: Build App (Unsigned)
        run: |
          cd ios
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' | head -1 | xargs basename)
          if [ -z "$WORKSPACE" ]; then
            echo "No .xcworkspace file found!"
            exit 1
          fi
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          ARCHIVE_NAME=unsigned.xcarchive
          IPA_NAME="${SCHEME}.ipa"

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"
          echo "Archive: $ARCHIVE_NAME"
          echo "IPA: $IPA_NAME"

          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            clean archive \
            -archivePath "$ARCHIVE_NAME" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          cd "$ARCHIVE_NAME/Products"
          mv Applications Payload
          zip -r Payload.zip Payload
          mv Payload.zip ../../"$IPA_NAME"
          cd ../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ios/*.ipa
